name: Build & Release APK

on:
  push:
    tags:
      - 'v[0-9]+.0.0'         # Tier 1: Major Version Upgrade (e.g. v1.0.0, v2.0.0)
      - 'v[0-9]+.[0-9]+.0'    # Tier 2: Minor Version Upgrade (e.g. v1.1.0, v1.2.0)
      # Tier 3 (Patch: e.g. v1.0.1) is excluded from automated APK release builds
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          RAW_VERSION="${{ github.ref_name }}"
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/^v//')
          if [ -z "$CLEAN_VERSION" ] || [ "$CLEAN_VERSION" = "main" ] || [ "$CLEAN_VERSION" = "master" ]; then
            CLEAN_VERSION="${{ github.event.inputs.version || '1.1.0' }}"
            CLEAN_VERSION=$(echo "$CLEAN_VERSION" | sed 's/^v//')
          fi
          ./gradlew assembleRelease -PversionName="$CLEAN_VERSION" -PversionCode=${{ github.run_number }}

      - name: Prepare APK Artifacts
        id: prepare_apk
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "master" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ github.event.inputs.version || 'v1.1.0' }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          OUTPUT_DIR="app/build/outputs/apk/release"
          APK_NAME="NirvanaControl-${VERSION}.apk"
          
          if [ -f "$OUTPUT_DIR/app-release.apk" ]; then
            cp "$OUTPUT_DIR/app-release.apk" "$OUTPUT_DIR/$APK_NAME"
            echo "APK_PATH=$OUTPUT_DIR/$APK_NAME" >> $GITHUB_ENV
          elif [ -f "$OUTPUT_DIR/app-release-unsigned.apk" ]; then
            cp "$OUTPUT_DIR/app-release-unsigned.apk" "$OUTPUT_DIR/$APK_NAME"
            echo "APK_PATH=$OUTPUT_DIR/$APK_NAME" >> $GITHUB_ENV
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NirvanaControl-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.APK_PATH }}
          name: "Nirvana Control ${{ env.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
